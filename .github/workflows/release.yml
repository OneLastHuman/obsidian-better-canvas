name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify release tag matches plugin version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
      - name: Package installable plugin
        run: |
          mkdir -p dist/obsidian-better-canvas
          cp main.js manifest.json styles.css dist/obsidian-better-canvas/
          (cd dist && zip -qr obsidian-better-canvas.zip obsidian-better-canvas)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Better Canvas ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/obsidian-better-canvas.zip
            dist/obsidian-better-canvas/main.js
            dist/obsidian-better-canvas/manifest.json
            dist/obsidian-better-canvas/styles.css
