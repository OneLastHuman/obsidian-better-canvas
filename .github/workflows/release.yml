name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify release tag and plugin versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
          const tag = process.env.RELEASE_TAG;
          const tagVersion = tag.startsWith("v") ? tag.slice(1) : "";

          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tagVersion)) {
            throw new Error(`Invalid release tag "${tag}". Expected vMAJOR.MINOR.PATCH, optionally with a prerelease suffix.`);
          }
          if (packageJson.version !== manifest.version) {
            throw new Error(`package.json version (${packageJson.version}) does not match manifest.json version (${manifest.version}).`);
          }
          if (tagVersion !== manifest.version) {
            throw new Error(`Release tag ${tag} does not match plugin version ${manifest.version}.`);
          }
          if (!Object.prototype.hasOwnProperty.call(versions, manifest.version)) {
            throw new Error(`versions.json is missing entry "${manifest.version}".`);
          }
          if (versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error(`versions.json requires Obsidian ${versions[manifest.version]} for ${manifest.version}, but manifest.json declares ${manifest.minAppVersion}.`);
          }

          console.log(`Validated release ${tag} (minimum Obsidian version ${manifest.minAppVersion}).`);
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify and package installable plugin
        shell: bash
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css

          mkdir -p dist/obsidian-better-canvas
          cp main.js manifest.json styles.css dist/obsidian-better-canvas/
          (cd dist && zip -qr obsidian-better-canvas.zip obsidian-better-canvas)
          (
            cd dist
            sha256sum \
              obsidian-better-canvas.zip \
              obsidian-better-canvas/main.js \
              obsidian-better-canvas/manifest.json \
              obsidian-better-canvas/styles.css \
              > SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Better Canvas ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/obsidian-better-canvas.zip
            dist/obsidian-better-canvas/main.js
            dist/obsidian-better-canvas/manifest.json
            dist/obsidian-better-canvas/styles.css
            dist/SHA256SUMS
