name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release metadata
        run: npm run validate:metadata
      - run: npm ci
      - name: Verify artifact lifecycle policy
        run: npm run verify:workflow-artifacts
      - name: Run ESLint
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish-installable-bundle:
    name: Sync installable bundle to repository
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Sync installable files
        shell: bash
        run: |
          mkdir -p release
          cp main.js release/main.js
          cp manifest.json release/manifest.json
          cp styles.css release/styles.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/main.js release/manifest.json release/styles.css
          if git diff --cached --quiet; then
            echo "Release directory is already up to date."
            exit 0
          fi
          git commit -m "build: refresh installable plugin bundle"
          git push origin HEAD:main
